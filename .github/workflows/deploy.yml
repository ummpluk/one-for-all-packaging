name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Build public website
        run: |
          mkdir -p ./public
          cp index.html Bag.html Roll.html Pouches.html ./public/
          cp robots.txt sitemap.xml favicon.ico LOGO.png cover.png ./public/
          cp 38871344-*.png 391f3399-*.png 8837d3bd-*.png ./public/ 2>/dev/null || true
          cp -r icons ./public/
          cp -r รูปสินค้า ./public/
          cp "DOC/โฟลเดอร์ใหม่/OFAFirebaseHosting2/ofa-hosting/firebase.json" ./firebase.json
          cp "DOC/โฟลเดอร์ใหม่/OFAFirebaseHosting2/ofa-hosting/.firebaserc" ./.firebaserc

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project oneforall-office --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
